<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minha Empresa</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f5f5f5;
}

header{
    background:#0d6efd;
    color:#fff;
    padding:20px;
    text-align:center;
}

nav{
    background:#084298;
    padding:15px;
    text-align:center;
}

nav a{
    color:white;
    text-decoration:none;
    margin:15px;
}

.hero{
    padding:80px 20px;
    text-align:center;
    background:white;
}

.hero h1{
    font-size:42px;
    margin-bottom:20px;
}

.hero p{
    font-size:20px;
    color:#555;
}

.btn{
    display:inline-block;
    margin-top:30px;
    padding:15px 35px;
    background:#0d6efd;
    color:white;
    text-decoration:none;
    border-radius:8px;
}

section{
    max-width:1100px;
    margin:auto;
    padding:60px 20px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

footer{
    background:#222;
    color:white;
    text-align:center;
    padding:20px;
}
</style>
</head>
<body>

<header>
<h2>Minha Empresa</h2>
</header>

<nav>
<a href="#">Início</a>
<a href="#">Serviços</a>
<a href="#">Sobre</a>
<a href="#">Contato</a>
</nav>

<div class="hero">
<h1>Bem-vindo!</h1>
<p>Criamos soluções para você e sua empresa.</p>

<a class="btn" href="#">Fale Conosco</a>
</div>

<section>

<h2 style="text-align:center;margin-bottom:40px;">Nossos Serviços</h2>

<div class="cards">

<div class="card">
<h3>Serviço 1</h3>
<p>Descrição do serviço.</p>
</div>

<div class="card">
<h3>Serviço 2</h3>
<p>Descrição do serviço.</p>
</div>

<div class="card">
<h3>Serviço 3</h3>
<p>Descrição do serviço.</p>
</div>

</div>

</section>

<footer>
© 2026 Minha Empresa - Todos os direitos reservados.
</footer>

</body>
</html>
